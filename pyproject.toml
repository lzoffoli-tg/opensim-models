[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensim-models"
version = "0.3.0"
description = "Composable OpenSim models, including an ANSUR II anthropometric user"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
opensim = ["opensim"]
cad = ["pythonocc-core"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opensim_models = ["models/user/assets/*", "models/user/assets/meshes/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
